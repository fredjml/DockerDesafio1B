name: Build and publish Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build validation image
        run: docker buildx build --platform linux/amd64 --load -t fullcycle:validation .

      - name: Validate output and image size
        shell: bash
        run: |
          set -euo pipefail

          expected='Full Cycle Rocks!!'
          actual="$(docker run --rm fullcycle:validation)"

          if [[ "$actual" != "$expected" ]]; then
            echo "Unexpected output: '$actual'"
            exit 1
          fi

          size="$(docker image inspect fullcycle:validation --format '{{.Size}}')"
          echo "Image size: ${size} bytes"

          if (( size >= 2000000 )); then
            echo "Image must be smaller than 2,000,000 bytes."
            exit 1
          fi

      - name: Docker Hub credentials not configured
        if: ${{ env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN == '' }}
        run: echo "Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to publish the image."

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            fredjml/fullcycle:latest
            fredjml/fullcycle:${{ github.sha }}
